<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的博客</title>
    <style>
        body {
            max-width: 600px;
            margin: 60px auto;
            padding: 0 20px;
            font-family: 'Microsoft YaHei', sans-serif;
            line-height: 1.8;
            color: #333;
            background: #fafafa;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 4px;
        }
        .sub {
            color: #888;
            font-size: 14px;
            margin-bottom: 40px;
        }
        .post {
            background: #fff;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .post h2 {
            font-size: 18px;
            margin-bottom: 4px;
        }
        .post h2 a {
            color: #1a73e8;
            text-decoration: none;
        }
        .post h2 a:hover {
            text-decoration: underline;
        }
        .date {
            color: #aaa;
            font-size: 13px;
        }
        .post p {
            color: #555;
            font-size: 15px;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <h1>我的博客</h1>
    <p class="sub">记录生活，分享想法</p >

    <div class="post">
        <h2><a href=" ">我的第一篇博客</a ></h2>
        <div class="date">2026-09-10</div>
        <p>这是第一篇文章，简单记录一下开始写博客的心情。</p >
    </div>

    <div class="post">
        <h2><a href="#">最近在学编程</a ></h2>
        <div class="date">2026-09-08</div>
        <p>从 HTML 和 CSS 开始，慢慢做出自己的网页，挺有成就感的。</p >
    </div>

    <div class="post">
        <h2><a href="#">周末随记</a ></h2>
        <div class="date">2026-09-05</div>
        <p>去图书馆待了一下午，安静的环境确实更容易专注。</p >
    </div>

</body>
</html>
