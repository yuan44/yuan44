<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="示例图片占位">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f6690"/>
      <stop offset="100%" stop-color="#7fd1c1"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0v24" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="720" height="360" fill="url(#g)"/>
  <rect width="720" height="360" fill="url(#grid)"/>
  <g fill="#ffffff" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <text x="360" y="176" font-size="30" font-weight="600">示例图片</text>
    <text x="360" y="212" font-size="15" opacity=".8">换成你自己的图片，或删掉这个 figure</text>
    <text x="360" y="300" font-size="13" opacity=".65">assets/sample-image.svg</text>
  </g>
</svg>
